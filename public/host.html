<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贾门专属 Icebreaker — 主持人</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --red: #C41E3A; --red-dark: #9B1B30; --gold: #D4A574; --gold-light: #F5E6D3;
  --cream: #FFF8F0; --dark: #2C1810; --gray: #8B7E74; --white: #FFFFFF;
  --shadow: 0 4px 20px rgba(44, 24, 16, 0.12);
  --shadow-lg: 0 8px 40px rgba(44, 24, 16, 0.2);
  --radius: 16px; --radius-sm: 10px;
}

html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", sans-serif;
  background: var(--cream); color: var(--dark); min-height: 100dvh; overflow-x: hidden;
}
.hidden { display: none !important; }

button {
  font-family: inherit; cursor: pointer; border: none; border-radius: var(--radius-sm);
  padding: 12px 28px; font-size: 1rem; font-weight: 600; transition: all 0.2s;
  -webkit-tap-highlight-color: transparent;
}
button:active { transform: scale(0.96); }

.btn-primary { background: var(--red); color: white; box-shadow: 0 4px 15px rgba(196,30,58,0.3); }
.btn-primary:hover { background: var(--red-dark); transform: translateY(-1px); }
.btn-outline { background: white; color: var(--red); border: 2px solid var(--red); }
.btn-outline:hover { background: #FFF0F3; }
.btn-gold { background: linear-gradient(135deg, #D4A574, #C4956A); color: white; box-shadow: 0 4px 15px rgba(212,165,116,0.4); }

input, textarea, select {
  font-family: inherit; font-size: 1rem; border: 2px solid #E8DDD4;
  border-radius: var(--radius-sm); padding: 12px 16px; background: white; transition: border-color 0.2s; width: 100%;
}
input:focus, textarea:focus, select:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(212,165,116,0.15); }

#host-view { max-width: 1200px; margin: 0 auto; padding: 32px 40px; min-height: 100dvh; }

.host-header {
  display: flex; align-items: center; justify-content: space-between;
  margin-bottom: 24px; padding-bottom: 20px; border-bottom: 2px solid var(--gold-light);
}
.host-header h1 {
  font-size: 2.4rem;
  background: linear-gradient(135deg, var(--red), var(--red-dark));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.host-header .room-info { display: flex; align-items: center; gap: 12px; font-size: 1.1rem; }
.host-header .room-code {
  background: var(--dark); color: var(--gold); padding: 8px 20px;
  border-radius: 30px; font-size: 1.6rem; font-weight: 900; letter-spacing: 4px;
}
.host-phase-badge { background: var(--gold-light); color: var(--dark); padding: 6px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 600; }
.host-controls { display: flex; gap: 12px; align-items: center; margin-bottom: 24px; flex-wrap: wrap; }

/* LOBBY */
#host-lobby { text-align: center; padding-top: 40px; }
#host-lobby .join-url-box {
  background: white; border-radius: var(--radius); padding: 32px; margin: 32px auto;
  max-width: 600px; box-shadow: var(--shadow-lg);
}
#host-lobby .join-url { font-size: 2rem; font-weight: 800; color: var(--red); letter-spacing: 1px; word-break: break-all; }
#host-lobby .join-label { font-size: 1.1rem; color: var(--gray); margin-bottom: 12px; }
#host-lobby .qr-container {
  margin: 20px auto; width: 200px; height: 200px; background: white;
  border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow);
}
#host-lobby .players-grid { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 20px auto; max-width: 700px; }
.player-chip {
  background: white; padding: 10px 20px; border-radius: 30px; font-size: 1.1rem;
  font-weight: 600; box-shadow: var(--shadow); animation: fadeInUp 0.3s ease;
  display: flex; align-items: center; gap: 8px;
}
.player-chip .dot { width: 10px; height: 10px; border-radius: 50%; background: #4CAF50; }

/* CARDS */
#host-cards { text-align: center; padding-top: 20px; }
#host-cards .progress-container { max-width: 500px; margin: 40px auto; }
#host-cards .progress-bar { height: 24px; background: #EEE; border-radius: 12px; overflow: hidden; margin-bottom: 12px; }
#host-cards .progress-fill { height: 100%; background: linear-gradient(90deg, var(--gold), var(--red)); border-radius: 12px; transition: width 0.5s ease; }
#host-cards .card-preview-list { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 20px; }
.card-preview-chip {
  background: white; padding: 8px 18px; border-radius: 20px; font-size: 0.95rem;
  box-shadow: var(--shadow); display: flex; align-items: center; gap: 6px;
}
.card-preview-chip.done { border: 2px solid #4CAF50; }
.card-preview-chip .check { color: #4CAF50; font-weight: bold; }

/* GUESS */
#host-guess { text-align: center; }
#host-guess .current-turn {
  background: white; border-radius: var(--radius); padding: 40px 32px;
  margin: 24px auto; max-width: 700px; box-shadow: var(--shadow-lg);
}
#host-guess .turn-label { font-size: 1.2rem; color: var(--gray); margin-bottom: 8px; }
#host-guess .turn-name { font-size: 3rem; font-weight: 900; color: var(--red); margin-bottom: 24px; }
#host-guess .card-display { display: grid; gap: 16px; text-align: left; }
#host-guess .card-item { background: var(--gold-light); padding: 20px 24px; border-radius: var(--radius-sm); border-left: 4px solid var(--gold); }
#host-guess .card-item .label { font-size: 0.85rem; color: var(--gray); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
#host-guess .card-item .value { font-size: 1.5rem; font-weight: 700; }
#host-guess .guess-result-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.7);
  display: flex; align-items: center; justify-content: center; z-index: 100; animation: fadeIn 0.3s ease;
}
#host-guess .guess-result-card {
  background: white; border-radius: var(--radius); padding: 48px; text-align: center;
  max-width: 500px; box-shadow: var(--shadow-lg); animation: popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
}
#host-guess .result-icon { font-size: 5rem; margin-bottom: 16px; }
#host-guess .result-title { font-size: 2rem; font-weight: 900; margin-bottom: 12px; }
#host-guess .progress-dots { display: flex; gap: 8px; justify-content: center; margin: 16px 0; }
#host-guess .progress-dot { width: 12px; height: 12px; border-radius: 50%; background: #DDD; transition: background 0.3s; }
#host-guess .progress-dot.done { background: #4CAF50; }
#host-guess .progress-dot.current { background: var(--red); transform: scale(1.4); }

/* BLUFF */
#host-bluff { text-align: center; }
#host-bluff .bluff-statement-card {
  background: white; border-radius: var(--radius-sm); padding: 24px 20px;
  box-shadow: var(--shadow); font-size: 1.4rem; font-weight: 700;
  cursor: default; transition: all 0.4s; position: relative;
  border: 3px solid transparent; text-align: left;
}
#host-bluff .bluff-statement-card .stmt-label {
  position: absolute; top: -14px; left: 16px; background: var(--red); color: white;
  width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center;
  justify-content: center; font-size: 0.9rem; font-weight: 900;
}
#host-bluff .bluff-statement-card.reveal-truth { border-color: #4CAF50; background: #F0FFF0; animation: pulse 0.6s ease 3; }
#host-bluff .bluff-statement-card.reveal-lie { border-color: #E0E0E0; opacity: 0.6; }
#host-bluff .leaderboard-item {
  display: flex; align-items: center; gap: 12px; background: white;
  padding: 14px 20px; border-radius: var(--radius-sm); margin-bottom: 8px; box-shadow: var(--shadow);
}
#host-bluff .leaderboard-item.winner { background: linear-gradient(135deg, #FFF9E6, #FFE0B2); border: 2px solid var(--gold); }
#host-bluff .leaderboard-rank { font-size: 1.5rem; font-weight: 900; width: 40px; }

/* PHOTO */
#host-photo { text-align: center; }
#host-photo .card-mosaic { display: flex; flex-wrap: wrap; gap: 16px; justify-content: center; margin: 32px 0; }
#host-photo .mosaic-card {
  background: white; border-radius: var(--radius-sm); padding: 20px; width: 240px;
  box-shadow: var(--shadow); text-align: left; border-top: 4px solid var(--red); animation: fadeInUp 0.5s ease both;
}
#host-photo .mosaic-card .m-name { font-size: 0.9rem; color: var(--gray); }
#host-photo .mosaic-card .m-gen { font-size: 1.2rem; font-weight: 700; color: var(--red); margin-bottom: 8px; }
#host-photo .mosaic-card .m-fact, .m-event { font-size: 0.9rem; margin-top: 6px; padding-left: 16px; position: relative; }
#host-photo .mosaic-card .m-fact::before { content: '❄️'; position: absolute; left: 0; top: 0; font-size: 0.7rem; }
#host-photo .mosaic-card .m-event::before { content: '⭐'; position: absolute; left: 0; top: 0; font-size: 0.7rem; }

.penalty-box {
  background: #FFF9E6; border: 2px dashed var(--gold); border-radius: var(--radius-sm);
  padding: 16px 20px; margin-top: 16px; font-size: 1.1rem; animation: popIn 0.3s ease;
}

@keyframes fadeInUp { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes popIn { from { opacity:0; transform:scale(0.8); } to { opacity:1; transform:scale(1); } }
@keyframes pulse { 0%,100%{ box-shadow:0 0 0 0 rgba(196,30,58,0.4); } 50%{ box-shadow:0 0 0 15px rgba(196,30,58,0); } }

.confetti-piece {
  position: fixed; width: 12px; height: 12px; top: -20px; z-index: 200;
  animation: confetti-fall 3s ease forwards; pointer-events: none;
}
@keyframes confetti-fall { 0%{ transform:translateY(-100px) rotate(0deg); opacity:1; } 100%{ transform:translateY(100vh) rotate(720deg); opacity:0; } }
.toast {
  position: fixed; top: 20px; left: 50%; transform:translateX(-50%); background: var(--dark);
  color: white; padding: 12px 24px; border-radius: 30px; font-weight: 600; z-index: 300;
  animation: fadeInUp 0.3s ease; box-shadow: var(--shadow-lg);
}

@media (max-width: 768px) {
  #host-view { padding: 16px; }
  #host-view .host-header h1 { font-size: 1.6rem; }
  #host-view .host-header .room-code { font-size: 1.2rem; }
  #host-view #host-lobby .join-url { font-size: 1.3rem; }
  #host-guess .turn-name { font-size: 2rem; }
  #host-guess .card-item .value { font-size: 1.2rem; }
  #host-bluff .bluff-statement-card { padding: 16px 12px; font-size: 1rem; }
}
</style>
</head>
<body>

<!-- ═══════════════════════════════════════ -->
<!--  HOST VIEW                             -->
<!-- ═══════════════════════════════════════ -->
<div id="host-view">
  <div class="host-header">
    <h1>🎬 贾门专属 Icebreaker</h1>
    <div class="room-info">
      <span>房间码</span>
      <span class="room-code" id="host-room-code">----</span>
      <span class="host-phase-badge" id="host-phase-badge">等待中</span>
    </div>
  </div>

  <div class="host-controls" id="host-controls">
    <button class="btn-outline" onclick="advancePhase('prev')" id="btn-prev" disabled>◀ 上一阶段</button>
    <button class="btn-primary" onclick="advancePhase('next')" id="btn-next">开始填卡片 ▶</button>
    <button class="btn-outline" onclick="resetGame()" style="margin-left:auto;">🔄 重新开始</button>
    <button class="btn-outline" onclick="skipToBluff()" id="btn-skip-bluff" style="display:none;">跳过竞猜→真心话大冒险</button>
  </div>

  <!-- LOBBY -->
  <div id="host-lobby">
    <div style="font-size:1.4rem; margin-bottom:8px;">📱 请同门用手机浏览器打开</div>
    <div class="join-url-box">
      <div class="join-label">加入地址</div>
      <div class="join-url" id="host-join-url">---</div>
      <div class="qr-container" id="qr-container"><span style="color:var(--gray);">加载中...</span></div>
    </div>
    <div style="font-size:1.1rem; margin-bottom:12px;">已加入：<strong id="host-player-count">0</strong> 人</div>
    <div class="players-grid" id="host-players-grid"></div>
  </div>

  <!-- CARDS -->
  <div id="host-cards" class="hidden">
    <h2 style="font-size:1.8rem; margin-bottom:8px;">📝 大家都在填卡片...</h2>
    <div class="progress-container">
      <div style="font-size:1.2rem; margin-bottom:4px;">已提交：<strong id="cards-done">0</strong> / <span id="cards-total">0</span></div>
      <div class="progress-bar"><div class="progress-fill" id="cards-progress-fill" style="width:0%"></div></div>
    </div>
    <div class="card-preview-list" id="card-preview-list"></div>
  </div>

  <!-- GUESS -->
  <div id="host-guess" class="hidden">
    <div class="progress-dots" id="guess-progress-dots"></div>
    <div class="current-turn" id="guess-turn-card">
      <div class="turn-label">🎯 轮到谁来猜？</div>
      <div class="turn-name" id="guess-turn-name">---</div>
      <div class="card-display" id="guess-card-display"></div>
    </div>
    <div id="guess-result-area"></div>
    <button class="btn-primary" id="btn-next-guesser" onclick="nextGuesser()" style="display:none; margin-top:12px;">下一个 ▶</button>
  </div>

  <!-- TRUTH or DARE -->
  <div id="host-bluff" class="hidden">
    <div style="text-align:center; padding-top:20px;">
      <h2 style="font-size:2rem; margin-bottom:8px;">🎲 真心话大冒险</h2>
      <p style="color:var(--gray); margin-bottom:8px;">随机抽取，展示身份卡，大家口头提问！</p>
      <div class="progress-dots" id="truth-progress-dots" style="margin-bottom:20px;"></div>
      <div class="current-turn" style="margin-bottom:20px;">
        <div style="font-size:1.5rem; font-weight:900; color:var(--red); margin-bottom:16px;" id="truth-target-name">---</div>
        <div class="card-display" id="truth-card-display" style="text-align:left;">
          <div class="card-item"><div class="label">🎂 学术代际</div><div class="value" id="truth-gen">---</div></div>
          <div class="card-item"><div class="label">❄️ 冷知识</div><div class="value" id="truth-fact">---</div></div>
          <div class="card-item"><div class="label">⭐ 标志性事件</div><div class="value" id="truth-event">---</div></div>
        </div>
      </div>
      <div style="display:flex; gap:12px; justify-content:center; flex-wrap:wrap;">
        <button class="btn-primary" id="btn-next-truth" onclick="nextTruth()" style="font-size:1.1rem; padding:14px 32px;">下一位 ▶</button>
        <button class="btn-outline" onclick="randomPenalty()">🎲 随机惩罚</button>
      </div>
      <div id="truth-done-msg" style="display:none; margin-top:20px;">
        <div style="font-size:3rem;">🎉</div>
        <div style="font-size:1.3rem; font-weight:700;">所有人都提问完毕！</div>
      </div>
    </div>
  </div>

  <!-- PHOTO -->
  <div id="host-photo" class="hidden">
    <h2 style="font-size:2rem; margin-bottom:8px;">📸 合影时刻！</h2>
    <p style="color:var(--gray); font-size:1.1rem; margin-bottom:20px;">贾门大家庭 🎓</p>
    <div class="card-mosaic" id="card-mosaic"></div>
    <button class="btn-gold" onclick="spawnConfetti()" style="font-size:1.2rem; padding:16px 40px; margin-top:20px;">🎉 撒花庆祝</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
const PHASES = ['LOBBY', 'CARDS', 'GUESS', 'BLUFF', 'PHOTO'];
let currentPhase = 'LOBBY';
let allPlayers = [];
let eventSource = null;

// ─── Init ───
window.addEventListener('DOMContentLoaded', () => {
  document.getElementById('host-view').classList.remove('hidden');
  fetchState();
  connectSSE();
  // Fetch public URL from server (auto-detected from tunnel)
  fetch('/api/public-url').then(r => r.json()).then(d => {
    const joinUrl = d.url || (location.protocol + '//' + d.localIP + ':' + location.port + '/');
    document.getElementById('host-join-url').textContent = joinUrl;
    setTimeout(generateQR, 500);
    setTimeout(generateQR, 2500);
  }).catch(() => {
    const joinUrl = location.origin + '/';
    document.getElementById('host-join-url').textContent = joinUrl;
  });
  setTimeout(generateQR, 800);
  setTimeout(generateQR, 3000);
});

function connectSSE() {
  eventSource = new EventSource('/events?role=host');
  eventSource.addEventListener('message', (e) => {
    try { const { event, data } = JSON.parse(e.data); handleEvent(event, data); } catch(err) {}
  });
  eventSource.onerror = () => {};
}

function handleEvent(event, data) {
  switch (event) {
    case 'init':
      currentPhase = data.phase;
      document.getElementById('host-room-code').textContent = data.roomCode;
      allPlayers = Object.entries(data.players || {}).map(([id, p]) => ({ playerId: id, name: p.name }));
      updateHostPhaseUI(data.phase);
      renderHostPlayers();
      renderHostCardProgress(data);
      if (data.phase === 'GUESS') fetchFullState();
      break;
    case 'player-joined': allPlayers.push({ playerId: data.playerId, name: data.name }); renderHostPlayers(); break;
    case 'player-list-update': allPlayers = Object.entries(data.players).map(([id, name]) => ({ playerId: id, name })); renderHostPlayers(); break;
    case 'phase-changed':
      currentPhase = data.phase;
      updateHostPhaseUI(data.phase);
      if (data.phase === 'GUESS') fetchFullState();
      if (data.phase === 'PHOTO') renderPhotoMosaic();
      break;
    case 'card-submitted': renderHostCardProgress({ cardsSubmitted: data.cardsSubmitted, totalPlayers: data.totalPlayers }); break;
    case 'guess-setup': setupGuessUI(data); break;
    case 'next-guesser': setupGuessUI(data); break;
    case 'guess-result': showGuessResult(data); break;
    case 'truth-target': showHostTruth(data); break;
    case 'truth-phase-done': showHostTruthDone(); break;
    case 'game-reset': location.reload(); break;
  }
}

function fetchState() {
  fetch('/api/state/full').then(r => r.json()).then(data => {
    currentPhase = data.phase;
    document.getElementById('host-room-code').textContent = data.roomCode;
    allPlayers = Object.entries(data.players || {}).map(([id, p]) => ({ playerId: id, name: p.name }));
    updateHostPhaseUI(data.phase);
    renderHostPlayers();
    renderHostCardProgress(data);
    if (data.phase === 'GUESS') fetchFullState();
    if (data.phase === 'BLUFF') setupHostBluffUI(data);
    if (data.phase === 'PHOTO') renderPhotoMosaic();
  });
}

function fetchFullState() {
  fetch('/api/state/full').then(r => r.json()).then(data => {
    if (data.phase === 'GUESS' && data.guessOrder && data.currentGuessIndex < data.guessOrder.length) {
      setupGuessUI({
        guessOrder: data.guessOrder.map(id => ({ playerId: id, name: data.players[id]?.name || '?' })),
        currentGuesser: { id: data.guessOrder[data.currentGuessIndex], name: data.players[data.guessOrder[data.currentGuessIndex]]?.name || '?' },
        currentCard: data.cards[data.guessAssignments[data.guessOrder[data.currentGuessIndex]]],
        index: data.currentGuessIndex, total: data.guessOrder.length,
      });
    }
  });
}

function updateHostPhaseUI(phase) {
  const badge = document.getElementById('host-phase-badge');
  const texts = { LOBBY: '🏠 等待加入', CARDS: '📝 填写卡片', GUESS: '🔍 竞猜环节', BLUFF: '🎲 真心话大冒险', PHOTO: '📸 合影' };
  badge.textContent = texts[phase] || phase;
  document.getElementById('host-lobby').classList.toggle('hidden', phase !== 'LOBBY');
  document.getElementById('host-cards').classList.toggle('hidden', phase !== 'CARDS');
  document.getElementById('host-guess').classList.toggle('hidden', phase !== 'GUESS');
  document.getElementById('host-bluff').classList.toggle('hidden', phase !== 'BLUFF');
  document.getElementById('host-photo').classList.toggle('hidden', phase !== 'PHOTO');
  const idx = PHASES.indexOf(phase);
  document.getElementById('btn-prev').disabled = idx <= 0;
  const btnNext = document.getElementById('btn-next');
  const nextLabels = { LOBBY: '开始填卡片 ▶', CARDS: '开始竞猜 ▶', GUESS: '开始真心话大冒险 ▶', BLUFF: '合影留念 ▶' };
  if (idx >= PHASES.length - 1) { btnNext.textContent = '已是最后阶段'; btnNext.disabled = true; }
  else { btnNext.textContent = nextLabels[phase] || '下一阶段 ▶'; btnNext.disabled = false; }
  document.getElementById('btn-skip-bluff').style.display = phase === 'GUESS' ? 'inline-block' : 'none';
}

function renderHostPlayers() {
  document.getElementById('host-player-count').textContent = allPlayers.length;
  document.getElementById('host-players-grid').innerHTML = allPlayers.map(p =>
    `<div class="player-chip"><span class="dot"></span>${escHtml(p.name)}</div>`).join('');
}

function renderHostCardProgress(data) {
  const done = data.cardsSubmitted || 0;
  const total = data.totalPlayers || allPlayers.length || 0;
  document.getElementById('cards-done').textContent = done;
  document.getElementById('cards-total').textContent = total;
  document.getElementById('cards-progress-fill').style.width = (total > 0 ? done/total*100 : 0) + '%';
  document.getElementById('card-preview-list').innerHTML = allPlayers.map(p => {
    const hasCard = data.players && data.players[p.playerId] && data.players[p.playerId].cardSubmitted;
    return `<div class="card-preview-chip ${hasCard ? 'done' : ''}">${hasCard ? '<span class="check">✓</span>' : '<span style="color:#CCC;">○</span>'}${escHtml(p.name)}</div>`;
  }).join('');
}

function setupGuessUI(data) {
  if (!data || !data.currentGuesser) {
    document.getElementById('guess-turn-name').textContent = '全部猜完！';
    document.getElementById('guess-card-display').innerHTML = '<p style="font-size:1.2rem; color:var(--gray);">进入下一阶段吧~</p>';
    document.getElementById('btn-next-guesser').style.display = 'none';
    return;
  }
  document.getElementById('guess-turn-name').textContent = data.currentGuesser.name;
  document.getElementById('btn-next-guesser').style.display = 'none';
  document.getElementById('guess-result-area').innerHTML = '';
  const dots = document.getElementById('guess-progress-dots');
  dots.innerHTML = Array.from({ length: data.total || 0 }, (_, i) =>
    `<div class="progress-dot${i < (data.index || 0) ? ' done' : ''}${i === (data.index || 0) ? ' current' : ''}"></div>`).join('');
  if (data.currentCard) {
    document.getElementById('guess-card-display').innerHTML = `
      <div class="card-item"><div class="label">🎂 学术代际</div><div class="value">${escHtml(data.currentCard.gen)}</div></div>
      <div class="card-item"><div class="label">❄️ 冷知识</div><div class="value">${escHtml(data.currentCard.fact)}</div></div>
      <div class="card-item"><div class="label">⭐ 标志性事件</div><div class="value">${escHtml(data.currentCard.event)}</div></div>`;
  }
}

function showGuessResult(data) {
  const area = document.getElementById('guess-result-area');
  const card = data.correct
    ? `<div class="result-icon">🎉</div><div class="result-title" style="color:#4CAF50;">猜对了！</div><div style="font-size:1.3rem;">这张卡片的主人就是 <strong style="color:var(--red);">${escHtml(data.cardOwnerName)}</strong></div>`
    : `<div class="result-icon">😅</div><div class="result-title" style="color:#FF9800;">猜错了！</div><div style="font-size:1.1rem; margin-bottom:12px;">实际主人：<strong>${escHtml(data.cardOwnerName)}</strong></div><div class="penalty-box">${data.penalty || '接受惩罚吧~'}</div>`;
  area.innerHTML = `<div class="guess-result-overlay" onclick="this.remove();document.getElementById('btn-next-guesser').style.display='inline-block';"><div class="guess-result-card">${card}<div style="margin-top:16px; color:var(--gray);">点击任意处关闭</div></div></div>`;
  if (data.correct) spawnConfetti();
}

// ─── Truth or Dare Functions ───
function showHostTruth(data) {
  var target = data.target;
  if (!target || !target.card) return;
  document.getElementById('truth-target-name').textContent = '🎯 ' + escHtml(target.name) + ' — 轮到你了！';
  document.getElementById('truth-gen').textContent = target.card.gen;
  document.getElementById('truth-fact').textContent = target.card.fact;
  document.getElementById('truth-event').textContent = target.card.event;
  document.getElementById('truth-card-display').style.display = '';
  document.getElementById('truth-done-msg').style.display = 'none';
  document.getElementById('btn-next-truth').style.display = 'inline-block';
  // Update progress dots
  var dots = document.getElementById('truth-progress-dots');
  var total = data.total || 0;
  var idx = data.index || 0;
  dots.innerHTML = Array.from({ length: total }, function(_, i) {
    var cls = 'progress-dot';
    if (i < idx) cls += ' done';
    if (i === idx) cls += ' current';
    return '<div class="' + cls + '"></div>';
  }).join('');
}

function showHostTruthDone() {
  document.getElementById('truth-card-display').style.display = 'none';
  document.getElementById('truth-done-msg').style.display = '';
  document.getElementById('btn-next-truth').style.display = 'none';
}

function nextTruth() {
  document.getElementById('btn-next-truth').disabled = true;
  fetch('/api/next-truth', { method: 'POST' }).then(function(r) { return r.json(); }).then(function(d) {
    document.getElementById('btn-next-truth').disabled = false;
    if (d.error) showToast(d.error);
  });
}

function randomPenalty() {
  fetch('/api/random-penalty').then(function(r) { return r.json(); }).then(function(d) {
    showToast(d.penalty || '没有惩罚~');
  });
}

function renderPhotoMosaic() {
  fetch('/api/state/full').then(r => r.json()).then(data => {
    const cards = data.cards || {};
    const players = data.players || {};
    document.getElementById('card-mosaic').innerHTML = Object.entries(cards).map(([pid, card], i) => `
      <div class="mosaic-card" style="animation-delay:${i*0.1}s">
        <div class="m-name">${escHtml(players[pid]?.name || '神秘人')}</div>
        <div class="m-gen">🎂 ${escHtml(card.gen)}</div>
        <div class="m-fact">${escHtml(card.fact)}</div>
        <div class="m-event">${escHtml(card.event)}</div>
      </div>`).join('') || '<p style="color:var(--gray);">暂无卡片</p>';
  });
}

// ─── Actions ───
function advancePhase(direction) {
  fetch('/api/advance-phase', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({direction}) })
    .then(r => r.json()).then(d => { if (d.error) showToast(d.error); });
}
function nextGuesser() { document.getElementById('btn-next-guesser').style.display='none'; fetch('/api/next-guesser', { method:'POST' }); }
function resetGame() { if (!confirm('确定重新开始吗？所有数据将被清除。')) return; fetch('/api/reset', { method:'POST' }); }
function skipToBluff() { if (!confirm('确定跳过竞猜，直接进入真心话大冒险吗？')) return; advancePhase('next'); }

// ─── Utils ───
function escHtml(s) { const d=document.createElement('div'); d.textContent=s||''; return d.innerHTML; }
function showToast(msg) { const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
function spawnConfetti() {
  const colors=['#C41E3A','#D4A574','#FFD700','#FF6B6B','#4CAF50','#2196F3','#FF9800','#9C27B0'];
  for(let i=0;i<60;i++) setTimeout(()=>{
    const p=document.createElement('div'); p.className='confetti-piece';
    p.style.left=Math.random()*100+'%'; p.style.background=colors[Math.floor(Math.random()*colors.length)];
    p.style.width=(Math.random()*12+6)+'px'; p.style.height=(Math.random()*12+6)+'px';
    p.style.borderRadius=Math.random()>0.5?'50%':'2px'; p.style.animationDuration=(Math.random()*2+2)+'s';
    document.body.appendChild(p); setTimeout(()=>p.remove(),3500);
  },i*30);
}
function generateQR() {
  const u=document.getElementById('host-join-url').textContent;
  const c=document.getElementById('qr-container');
  if (typeof QRCode!=='undefined') { c.innerHTML=''; try { new QRCode(c,{text:u,width:180,height:180,colorDark:'#2C1810',colorLight:'#FFFFFF'}); } catch(e){ c.innerHTML='<span style="padding:20px;">📱<br>直接输入上方网址</span>'; } }
  else { c.innerHTML='<span style="padding:20px;">📱<br>直接输入上方网址</span>'; }
}
</script>
</body>
